<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Comparador de Preços</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--bd:#e3e6ea;--ok:#15803d;--bad:#b91c1c;--ac:#2563eb}
  @media (prefers-color-scheme:dark){:root{--bg:#111418;--card:#1a1f26;--tx:#e8eaed;--mut:#9aa3ae;--bd:#2a313a;--ok:#4ade80;--bad:#f87171;--ac:#60a5fa}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.4 system-ui,sans-serif;padding:14px;max-width:560px;margin-inline:auto}
  h1{font-size:20px;margin:0 0 12px}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
  label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
  input,select,button{font:inherit;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);width:100%}
  button{cursor:pointer;background:var(--ac);color:#fff;border:0;font-weight:600}
  button.sec{background:var(--bg);color:var(--tx);border:1px solid var(--bd);font-weight:400}
  .row{display:flex;gap:8px}.row>*{flex:1}
  .res{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:15px}
  .best{color:var(--ok);font-weight:700}
  .verdict{margin-top:10px;padding:14px;border-radius:10px;font-weight:700;font-size:18px;background:var(--bg)}
  .verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
  small{color:var(--mut)}
  video{width:100%;border-radius:10px;margin-top:8px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<h1>🛒 Comparador de Preços</h1>

<div class="card" id="loginCard" hidden>
  <b>Entrar</b>
  <label>E-mail</label><input id="email" type="email" autocomplete="username">
  <label>Senha</label><input id="senha" type="password" autocomplete="current-password">
  <div class="row" style="margin-top:10px">
    <button id="entrar">Entrar</button>
    <button class="sec" id="criar">Criar conta</button>
  </div>
  <div id="loginMsg" style="margin-top:8px"></div>
</div>

<div id="appBox" hidden>
  <div class="card">
    <button id="scan">📷 Escanear código de barras</button>
    <video id="vid" hidden playsinline></video>
    <label>ou digite o código de barras</label>
    <div class="row"><input id="ean" inputmode="numeric" placeholder="789..."><button class="sec" id="buscar" style="flex:0 0 100px">Buscar</button></div>
    <label>Produto</label>
    <input id="nome" placeholder="Nome do produto">
    <button class="sec" id="buscarNome" style="margin-top:8px">🔎 Buscar pelo nome</button>
  </div>

  <div class="card">
    <b>Já sei dos preços</b>
    <div id="hist"><small>Escaneie um produto para ver o histórico.</small></div>
  </div>

  <div class="card">
    <b>Preço na prateleira</b>
    <div class="row">
      <div><label>Preço (R$)</label><input id="preco" type="number" step="0.01" inputmode="decimal"></div>
      <div><label>Quantidade</label><input id="qtd" type="number" step="any" inputmode="decimal" value="1"></div>
      <div><label>Unidade</label><select id="un"></select></div>
    </div>
    <label>Mercado</label><input id="loja" placeholder="Ex.: Mercado do Zé">
    <div id="veredito"></div>
    <button id="salvar" style="margin-top:10px">Salvar este preço</button>
    <div id="salvoMsg" style="margin-top:6px"></div>
  </div>

  <button class="sec" id="sair">Sair</button>
</div>

<script src="supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
